name: Sync to Gitee

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

jobs:
  sync:
    if: ${{ github.repository_owner == 'xomaps' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git clone --bare "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${REPO}.git"
          cd "${REPO}.git"
          git push --mirror "https://jokeway:${GITEE_TOKEN}@gitee.com/xomaps/${REPO}.git"
